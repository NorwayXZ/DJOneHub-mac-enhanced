name: macOS and Windows Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag matching App and backend version'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Dependencies
        run: brew install pkgconf
      - name: Version consistency
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/DJOneHubNotifier/Info.plist)" = "${TAG#v}"
          grep -F "const appVersion = \"${TAG#v}\"" cmd/djonehub-macos/main.go
      - name: Build release and update package
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          scripts/build-dmg-universal.sh "$TAG"
          scripts/package-app-update.sh "$TAG"
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes
          fi
          gh release upload "$TAG" dist/*.dmg dist/*.dmg.sha256 dist/DJOneHub-macOS-universal-update.zip dist/DJOneHub-macOS-universal-update.zip.sha256 --clobber
  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
      - name: Build service, tray app and installer
        shell: pwsh
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          CGO_ENABLED: '0'
        run: |
          $version = $env:TAG.TrimStart('v')
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          go build -trimpath -buildvcs=false -ldflags="-s -w" -o dist\windows\djonehub-service.exe ./cmd/djonehub-macos
          go build -trimpath -buildvcs=false -ldflags="-s -w -H=windowsgui" -o dist\windows\DJOneHub.exe ./cmd/djonehub-tray
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /Qp "/DAppVersion=$version" "/DBuildDir=..\dist\windows" windows\DJOneHub.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = Get-Item "dist\windows\DJOneHub-Windows-Setup-v$version.exe"
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() + "  " + $setup.Name | Set-Content -Encoding ascii -NoNewline "$($setup.FullName).sha256"
      - name: Upload installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release upload $env:TAG (Get-ChildItem dist\windows\DJOneHub-Windows-Setup-*.exe*).FullName --clobber
